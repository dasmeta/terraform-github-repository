name: Terraform Test
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - ./
    permissions:
      actions: write
      contents: write
      discussions: write
      pull-requests: write
    steps:
    # 4.3.1 is the first release that runs `terraform init` before
    # `terraform test`, and whose default Terraform version supports the native
    # test framework. 4.3.0 could not run these tests at all.
    - uses: dasmeta/reusable-actions-workflows/terraform-test@4.3.1
      with:
        # No AWS inputs: this module uses the github provider only. Passing
        # AWS credentials made the job fail at Configure AWS Credentials with
        # "The security token included in the request is invalid", before
        # Terraform ever ran.
        path: ${{ matrix.path }}
