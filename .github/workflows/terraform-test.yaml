name: Terraform Test
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - ./
          # The dependabot module owns the rendered-config regression tests, and
          # `terraform test` only reads the tests directory of the module it runs
          # in, so the root entry above never executes them.
          - ./modules/dependabot
          - ./modules/pre-commit
          - ./modules/terraform-test
          - ./modules/checkov
          - ./modules/tflint
          - ./modules/semantic-release
    permissions:
      actions: write
      contents: write
      discussions: write
      pull-requests: write
    steps:
    # 4.3.2 skips AWS credential setup when no AWS inputs are given. 4.3.1 added
    # the `terraform init` step and a default Terraform version supporting the
    # native test framework. Neither 4.3.0 nor 4.3.1 could run these tests.
    - uses: dasmeta/reusable-actions-workflows/terraform-test@4.3.2
      with:
        # No AWS inputs: this module uses the github provider only. Passing
        # AWS credentials made the job fail at Configure AWS Credentials with
        # "The security token included in the request is invalid", before
        # Terraform ever ran.
        path: ${{ matrix.path }}
