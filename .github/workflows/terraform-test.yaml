name: Terraform Test
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - ./
    permissions:
      actions: write
      contents: write
      discussions: write
      pull-requests: write
    steps:
    - uses: dasmeta/reusable-actions-workflows/terraform-test@4.3.0
      with:
        aws-region: ${{ secrets.AWS_REGION}}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        path: ${{ matrix.path }}
        # The action defaults to Terraform 1.3.6, which predates the native test
        # framework and cannot parse .tftest.hcl files. Pin explicitly to a
        # version that supports `terraform test` (>= 1.6).
        terraform_version: 1.9.8
